<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Relay</title>
    <meta name="description" content="Set a new password for your Relay workspace account">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">

    <div class="login-bg">
        <div class="login-orb orb-1"></div>
        <div class="login-orb orb-2"></div>
        <div class="login-orb orb-3"></div>
    </div>

    <div class="login-wrapper">
        <div class="login-card">
            <!-- Brand -->
            <div class="login-brand">
                <div class="login-brand-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                        <path d="M13 2L4.09 12.11a1 1 0 0 0 .77 1.64H11l-1 8.25L19.91 11.89a1 1 0 0 0-.77-1.64H13L14 2z" fill="currentColor"/>
                    </svg>
                </div>
                <h1 class="login-brand-name">Relay</h1>
            </div>

            <p class="login-subtitle">Set a new password for <strong>{{ user.full_name }}</strong> ({{ user.employee_id }})</p>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                    <div class="login-alert login-alert-{{ category }}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        {{ message }}
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Reset Password Form -->
            <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}" class="login-form" id="resetForm">
                <div class="form-group">
                    <label class="form-label" for="password">New Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" name="password" class="form-input"
                               placeholder="Enter new password (min. 6 chars)" required minlength="6" autocomplete="new-password">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm New Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-input"
                               placeholder="Re-enter new password" required minlength="6" autocomplete="new-password">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="resetBtn">
                    Update Password
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </button>
            </form>

            <div style="margin-top: 20px; text-align: center;">
                <a href="{{ url_for('auth.login') }}" style="font-size: 13px; color: var(--text3); text-decoration: none; transition: color 0.15s;">
                    ← Back to Login
                </a>
            </div>
        </div>
    </div>

</body>
</html>
